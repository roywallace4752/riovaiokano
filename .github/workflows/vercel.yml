name: Ultimate Ephemeral Xray Vercel Pipeline

on:
  workflow_dispatch:

jobs:
  build-and-tunnel:
    runs-on: ubuntu-latest

    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq unzip

      - name: Install Xray
        run: |
          sudo bash -c "$(curl -L https://github.com/XTLS/Xray-install/raw/main/install-release.sh)" @ install

      - name: Configure Xray (VLESS + XHTTP packet-up)
        run: |
          sudo mkdir -p /usr/local/etc/xray
          
          sudo tee /usr/local/etc/xray/config.json << 'EOF'
          {
            "log": {
              "loglevel": "warning",
              "access": "/var/log/xray/access.log",
              "error": "/var/log/xray/error.log"
            },
            "inbounds": [
              {
                "port": 6969,
                "listen": "127.0.0.1",
                "protocol": "vless",
                "settings": {
                  "clients": [
                    {
                      "id": "61e89599-47de-45ca-93ba-8a84e89d7391"
                    }
                  ],
                  "decryption": "none"
                },
                "streamSettings": {
                  "network": "xhttp",
                  "xhttpSettings": {
                    "path": "/api",
                    "mode": "packet-up",
                    "extra": {
                      "responseHeader": {
                        "Content-Type": "application/octet-stream",
                        "Transfer-Encoding": "chunked"
                      }
                    }
                  }
                }
              }
            ],
            "outbounds": [
              {
                "protocol": "freedom"
              }
            ]
          }
          EOF

      - name: Fix Permissions & Start Xray
        run: |
          sudo mkdir -p /var/log/xray
          sudo chown -R runner:runner /var/log/xray
          sudo chmod 777 /var/log/xray

          sudo pkill xray || true
          
          # اجرای درست با sudo
          sudo /usr/local/bin/xray run -config /usr/local/etc/xray/config.json > /dev/null 2>&1 &
          
          sleep 5
          
          echo "=== Xray Processes ==="
          ps aux | grep xray
          
          echo "=== Port 6969 Status ==="
          sudo ss -tulpn | grep 6969 || echo "❌ Port 6969 is NOT listening!"

      - name: Install & Start Cloudflare Quick Tunnel
        run: |
          sudo curl -L --output /tmp/cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared.deb

          nohup sudo cloudflared tunnel --url http://127.0.0.1:6969 \
            --http2-origin --loglevel info > cloudflared.log 2>&1 &

          TUNNEL_URL=""
          for i in {1..40}; do
            sleep 3
            TUNNEL_URL=$(grep -oE "https://[a-zA-Z0-9-]+\.trycloudflare\.com" cloudflared.log | tail -n 1)
            if [ -n "$TUNNEL_URL" ]; then
              echo "✅ Tunnel established: $TUNNEL_URL"
              break
            fi
            echo "Attempt $i/40..."
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "❌ Tunnel failed!"
            cat cloudflared.log
            exit 1
          fi

          echo "CF_TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_ENV

      - name: Download Theme1 Project
        run: |
          curl -L https://github.com/masezahedi/theme1/archive/refs/heads/main.zip -o theme1.zip
          unzip theme1.zip
          cd theme1-main
          echo "PROJECT_DIR=$(pwd)" >> $GITHUB_ENV

      - name: Create vercel.json
        run: |
          cd ${{ env.PROJECT_DIR }}
          cat > vercel.json << EOF
          {
            "version": 2,
            "rewrites": [
              {
                "source": "/api/:path*",
                "destination": "${{ env.CF_TUNNEL_URL }}/api/:path*"
              }
            ],
            "headers": [
              {
                "source": "/api/:path*",
                "headers": [
                  { "key": "Cache-Control", "value": "no-store, no-cache, must-revalidate" },
                  { "key": "CDN-Cache-Control", "value": "no-store" },
                  { "key": "Vercel-CDN-Cache-Control", "value": "no-store" }
                ]
              }
            ]
          }
          EOF
          cat vercel.json

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm install -g vercel --unsafe-perm
          cd ${{ env.PROJECT_DIR }}
          
          VERCEL_URL=$(vercel --token=$VERCEL_TOKEN --prod --yes | grep -oE "https://[a-zA-Z0-9-]+\.vercel\.app" | head -n 1)
          
          if [ -z "$VERCEL_URL" ]; then
            echo "❌ Vercel deployment failed"
            exit 1
          fi

          CLEAN_VERCEL_URL=$(echo $VERCEL_URL | sed 's|https://||g')
          
          echo "✅ Vercel URL: $VERCEL_URL"
          
          FINAL_CONFIG="vless://61e89599-47de-45ca-93ba-8a84e89d7391@$CLEAN_VERCEL_URL:443?encryption=none&security=tls&fp=chrome&allowInsecure=1&type=xhttp&host=$CLEAN_VERCEL_URL&path=%2Fapi&mode=packet-up#Ultimate-Ephemeral"
          
          echo "🎯 CLIENT CONFIG:"
          echo "$FINAL_CONFIG"
