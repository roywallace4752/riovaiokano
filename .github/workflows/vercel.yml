name: Ultimate Ephemeral Xray Vercel Pipeline

on:
  workflow_dispatch: # اجرای دستی از طریق پنل گیت‌هاب

jobs:
  build-and-tunnel:
    runs-on: ubuntu-latest
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq unzip

      - name: Install Xray
        run: |
          sudo bash -c "$(curl -L https://github.com/XTLS/Xray-install/raw/main/install-release.sh)" @ install
          
      - name: Configure Xray (vless + xhttp optimized for Serverless)
        run: |
          sudo mkdir -p /usr/local/etc/xray
          
          sudo tee /usr/local/etc/xray/config.json << 'EOF'
          {
            "log": {
              "loglevel": "info"
            },
            "inbounds": [
              {
                "port": 6969,
                "protocol": "vless",
                "settings": {
                  "clients": [
                    {
                      "id": "61e89599-47de-45ca-93ba-8a84e89d7391"
                    }
                  ],
                  "decryption": "none"
                },
                "streamSettings": {
                  "network": "xhttp",
                  "xhttpSettings": {
                    "path": "/api",
                    "mode": "packet-up",
                    "extra": {
                      "responseHeader": {
                        "Content-Type": "application/octet-stream",
                        "Transfer-Encoding": "chunked"
                      }
                    }
                  }
                }
              }
            ],
            "outbounds": [
              {
                "protocol": "freedom"
              }
            ]
          }
          EOF
          sudo systemctl restart xray

      - name: Check Xray Status
        run: |
          echo "=== Xray Service Status ==="
          sudo systemctl status xray --no-pager || true
          echo "=== Checking if Port 6969 is Listening ==="
          sudo ss -tulpn | grep 6969 || echo "Port 6969 is NOT listening!"

      - name: Install & Start Cloudflare Quick Tunnel
        run: |
          sudo curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          
          # استفاده از پروتکل استاندارد و فلگ فعال‌ساز HTTP/2 برای اوریجین
          sudo cloudflared tunnel --url http://127.0.0.1:6969 --http2-origin > cloudflared.log 2>&1 &
          
          # لوپ انتظار داینامیک برای مطمئن شدن از دریافت آدرس تانل
          TUNNEL_URL=""
          for i in {1..15}; do
            if [ -f cloudflared.log ]; then
              TUNNEL_URL=$(grep -oE "https://[a-zA-Z0-9-]+.trycloudflare.com" cloudflared.log | head -n 1)
              if [ ! -z "$TUNNEL_URL" ]; then
                echo "🎯 Cloudflare Tunnel established successfully!"
                break
              fi
            fi
            echo "⏳ Waiting for Cloudflare Tunnel to generate URL (Attempt $i/15)..."
            sleep 2
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "❌ Error: Cloudflare Tunnel failed to generate a URL!"
            echo "=== Cloudflared Logs ==="
            cat cloudflared.log
            exit 1
          fi

          echo "CF_TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_ENV
          echo "Cloudflare Tunnel URL is: $TUNNEL_URL"

      - name: Download and Extract Theme1 Project
        run: |
          sudo curl -L https://github.com/masezahedi/theme1/archive/refs/heads/main.zip -o theme1.zip
          sudo unzip theme1.zip
          cd theme1-main
          echo "PROJECT_DIR=$(pwd)" >> $GITHUB_ENV

      - name: Update vercel.json with Cloudflare Tunnel URL
        run: |
          cd ${{ env.PROJECT_DIR }}
          
          sudo tee vercel.json << EOF
          {
            "version": 2,
            "rewrites": [
              {
                "source": "/api/:path*",
                "destination": "$CF_TUNNEL_URL/api/:path*"
              }
            ],
            "headers": [
              {
                "source": "/api/:path*",
                "headers": [
                  {
                    "key": "Cache-Control",
                    "value": "no-store"
                  },
                  {
                    "key": "CDN-Cache-Control",
                    "value": "no-store"
                  },
                  {
                    "key": "Vercel-CDN-Cache-Control",
                    "value": "no-store"
                  }
                ]
              }
            ]
          }
          EOF
          sudo cat vercel.json

      - name: Install Vercel CLI & Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          sudo npm install -g vercel --unsafe-perm
          cd ${{ env.PROJECT_DIR }}
          
          VERCEL_OUTPUT=$(sudo vercel --token=$VERCEL_TOKEN --prod --yes)
          echo "$VERCEL_OUTPUT"
          
          VERCEL_URL=$(echo "$VERCEL_OUTPUT" | grep -oE "https://[a-zA-Z0-9-]+.vercel.app" | head -n 1)
          
          if [ -z "$VERCEL_URL" ]; then
            echo "❌ Error: Could not extract Vercel Deployment URL!"
            exit 1
          fi
          
          CLEAN_VERCEL_URL=$(echo $VERCEL_URL | sed -e 's/https:\/\///g')
          
          echo "--------------------------------------------------"
          echo "🔥 DEPLOYMENT SUCCESSFUL! 🔥"
          echo "Vercel Project URL: $VERCEL_URL"
          echo "--------------------------------------------------"
          
          # لینک کانفیگ نهایی کلاینت آپدیت‌شده با xhttp settings جدید
          FINAL_CONFIG="vless://61e89599-47de-45ca-93ba-8a84e89d7391@$CLEAN_VERCEL_URL:443?encryption=none&security=tls&fp=chrome&insecure=1&allowInsecure=1&type=xhttp&host=$CLEAN_VERCEL_URL&path=%2Fapi&mode=packet-up#MZF"
          
          echo ""
          echo "🎯 YOUR CLIENT CONFIG:"
          echo "$FINAL_CONFIG"
          echo ""
          echo "--------------------------------------------------"

      - name: Keep Runner Alive for 6 Hours
        run: |
          echo "Runner is alive and serving proxies. Sleeping for 6 hours..."
          
          # نمایش زنده لاگ‌ها جهت عیب‌یابی رفتاری کلاینت
          sudo journalctl -u xray -f &
          sudo tail -f cloudflared.log &
          
          sleep 6h
