name: Ultimate Stable Xray Vercel Pipeline

on:
  workflow_dispatch:

jobs:
  build-and-tunnel:
    runs-on: ubuntu-latest
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq unzip

      - name: Install Xray Official
        run: |
          sudo bash -c "$(curl -L https://github.com/XTLS/Xray-install/raw/main/install-release.sh)" @ install

      - name: Force Clean Custom Xray Config (VLESS + WS)
        run: |
          sudo rm -f /usr/local/etc/xray/config.json
          sudo mkdir -p /usr/local/etc/xray
          
          sudo tee /usr/local/etc/xray/config.json << 'EOF'
          {
            "log": {
              "loglevel": "info"
            },
            "inbounds": [
              {
                "port": 8080,
                "protocol": "vless",
                "settings": {
                  "clients": [
                    {
                      "id": "61e89599-47de-45ca-93ba-8a84e89d7391"
                    }
                  ],
                  "decryption": "none"
                },
                "streamSettings": {
                  "network": "ws",
                  "wsSettings": {
                    "path": "/api/vless"
                  }
                }
              }
            ],
            "outbounds": [
              {
                "protocol": "freedom"
              }
            ]
          }
          EOF
          # متوقف کردن سرویس قبلی و اجرای مجدد به صورت کاملاً مستقل
          sudo systemctl stop xray || true
          sudo systemctl kill xray || true
          sudo systemctl daemon-reload
          sudo systemctl start xray

      - name: Verify Xray is Actually on WS
        run: |
          sleep 3
          sudo systemctl status xray --no-pager
          sudo ss -tulpn | grep 8080

      - name: Install & Start Cloudflare Tunnel
        run: |
          sudo curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          
          sudo cloudflared tunnel --url http://127.0.0.1:8080 > cloudflared.log 2>&1 &
          
          TUNNEL_URL=""
          for i in {1..15}; do
            if [ -f cloudflared.log ]; then
              TUNNEL_URL=$(grep -oE "https://[a-zA-Z0-9-]+.trycloudflare.com" cloudflared.log | head -n 1)
              if [ ! -z "$TUNNEL_URL" ]; then
                break
              fi
            fi
            echo "⏳ Waiting for Cloudflare Tunnel URL..."
            sleep 2
          done

          if [ -z "$TUNNEL_URL" ]; then
            cat cloudflared.log
            exit 1
          fi

          echo "CF_TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_ENV
          echo "Tunnel Link: $TUNNEL_URL"

      - name: Create Dynamic Vercel Project (Clean Setup)
        run: |
          mkdir -p vercel_project/api
          cd vercel_project
          
          # ساخت یک روت تمیز که ورسل نتواند در آن اختلال ایجاد کند
          sudo tee vercel.json << EOF
          {
            "version": 2,
            "rewrites": [
              {
                "source": "/api/vless",
                "destination": "$CF_TUNNEL_URL/api/vless"
              }
            ]
          }
          EOF

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          sudo npm install -g vercel --unsafe-perm
          cd vercel_project
          
          VERCEL_OUTPUT=$(sudo vercel --token=$VERCEL_TOKEN --prod --yes)
          echo "$VERCEL_OUTPUT"
          
          VERCEL_URL=$(echo "$VERCEL_OUTPUT" | grep -oE "https://[a-zA-Z0-9-]+.vercel.app" | head -n 1)
          CLEAN_VERCEL_URL=$(echo $VERCEL_URL | sed -e 's/https:\/\///g')
          
          echo "--------------------------------------------------"
          echo "🎯 NEW CLEAN CONNECTION CONFIG:"
          echo "vless://61e89599-47de-45ca-93ba-8a84e89d7391@$CLEAN_VERCEL_URL:443?encryption=none&security=tls&fp=chrome&type=ws&host=$CLEAN_VERCEL_URL&path=%2Fapi%2Fvless#MZF_FIXED_WS"
          echo "--------------------------------------------------"

      - name: Keep Runner Alive
        run: |
          echo "Runner is actively tunnelled. Watching logs..."
          sudo journalctl -u xray -f &
          sudo tail -f cloudflared.log &
          sleep 6h
