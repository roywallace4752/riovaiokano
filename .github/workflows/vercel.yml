name: Ultimate Ephemeral Xray Vercel Pipeline

on:
  workflow_dispatch:

jobs:
  build-and-tunnel:
    runs-on: ubuntu-latest

    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq unzip

      - name: Install Xray
        run: |
          sudo bash -c "$(curl -L https://github.com/XTLS/Xray-install/raw/main/install-release.sh)" @ install

      - name: Configure Xray (VLESS + XHTTP packet-up)
        run: |
          sudo mkdir -p /usr/local/etc/xray
          
          sudo tee /usr/local/etc/xray/config.json << 'EOF'
          {
            "log": {
              "loglevel": "warning"
            },
            "inbounds": [
              {
                "port": 6969,
                "listen": "127.0.0.1",
                "protocol": "vless",
                "settings": {
                  "clients": [
                    {
                      "id": "61e89599-47de-45ca-93ba-8a84e89d7391"
                    }
                  ],
                  "decryption": "none"
                },
                "streamSettings": {
                  "network": "xhttp",
                  "xhttpSettings": {
                    "path": "/api",
                    "mode": "packet-up",
                    "extra": {
                      "responseHeader": {
                        "Content-Type": "application/octet-stream",
                        "Transfer-Encoding": "chunked"
                      }
                    }
                  }
                }
              }
            ],
            "outbounds": [
              {
                "protocol": "freedom"
              }
            ]
          }
          EOF

      - name: Start Xray (Direct Run)
        run: |
          sudo pkill xray || true
          sudo /usr/local/bin/xray run -config /usr/local/etc/xray/config.json > /var/log/xray.log 2>&1 &
          sleep 4
          echo "=== Xray Process Status ==="
          ps aux | grep xray
          echo "=== Port 6969 ==="
          sudo ss -tulpn | grep 6969 || echo "Port 6969 is NOT listening!"

      - name: Install & Start Cloudflare Quick Tunnel
        run: |
          sudo curl -L --output /tmp/cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared.deb

          # اجرای Cloudflared با لاگ کامل
          nohup sudo cloudflared tunnel --url http://127.0.0.1:6969 \
            --http2-origin \
            --loglevel debug > cloudflared.log 2>&1 &

          echo "⏳ Waiting for Cloudflare Tunnel URL..."

          TUNNEL_URL=""
          for i in {1..35}; do
            sleep 3
            TUNNEL_URL=$(grep -oE "https://[a-zA-Z0-9-]+\.trycloudflare\.com" cloudflared.log | tail -n 1)
            if [ -n "$TUNNEL_URL" ]; then
              echo "✅ Cloudflare Tunnel established!"
              echo "Tunnel URL: $TUNNEL_URL"
              break
            fi
            echo "Attempt $i/35..."
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "❌ Failed to get Tunnel URL"
            cat cloudflared.log
            exit 1
          fi

          echo "CF_TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_ENV

      - name: Download Theme1 Project
        run: |
          curl -L https://github.com/masezahedi/theme1/archive/refs/heads/main.zip -o theme1.zip
          unzip theme1.zip
          cd theme1-main
          echo "PROJECT_DIR=$(pwd)" >> $GITHUB_ENV

      - name: Create vercel.json
        run: |
          cd ${{ env.PROJECT_DIR }}
          
          cat > vercel.json << EOF
          {
            "version": 2,
            "rewrites": [
              {
                "source": "/api/:path*",
                "destination": "${{ env.CF_TUNNEL_URL }}/api/:path*"
              }
            ],
            "headers": [
              {
                "source": "/api/:path*",
                "headers": [
                  {
                    "key": "Cache-Control",
                    "value": "no-store, no-cache, must-revalidate, proxy-revalidate"
                  },
                  {
                    "key": "CDN-Cache-Control",
                    "value": "no-store"
                  },
                  {
                    "key": "Vercel-CDN-Cache-Control",
                    "value": "no-store"
                  },
                  {
                    "key": "Connection",
                    "value": "keep-alive"
                  }
                ]
              }
            ]
          }
          EOF

          cat vercel.json

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm install -g vercel --unsafe-perm
          
          cd ${{ env.PROJECT_DIR }}
          
          VERCEL_OUTPUT=$(vercel --token=$VERCEL_TOKEN --prod --yes 2>&1)
          echo "$VERCEL_OUTPUT"
          
          VERCEL_URL=$(echo "$VERCEL_OUTPUT" | grep -oE "https://[a-zA-Z0-9-]+\.vercel\.app" | head -n 1)
          
          if [ -z "$VERCEL_URL" ]; then
            echo "❌ Could not detect Vercel URL"
            exit 1
          fi

          CLEAN_VERCEL_URL=$(echo $VERCEL_URL | sed 's|https://||g')
          
          echo "--------------------------------------------------"
          echo "✅ DEPLOYMENT SUCCESSFUL!"
          echo "Vercel URL: $VERCEL_URL"
          echo "--------------------------------------------------"
          
          FINAL_CONFIG="vless://61e89599-47de-45ca-93ba-8a84e89d7391@$CLEAN_VERCEL_URL:443?encryption=none&security=tls&fp=chrome&allowInsecure=1&type=xhttp&host=$CLEAN_VERCEL_URL&path=%2Fapi&mode=packet-up#Ultimate-Ephemeral"
          
          echo "🎯 CLIENT CONFIG:"
          echo "$FINAL_CONFIG"
          echo "--------------------------------------------------"

      - name: Keep Runner Alive (6 Hours)
        run: |
          echo "Runner is running... Keeping services alive for 6 hours."
          sleep 6h
